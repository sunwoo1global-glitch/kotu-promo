# GitHub Pages 자동 배포 — KOTU 랜딩 페이지
# 목적: main 브랜치의 landing/ 폴더 변경 시 GitHub Pages로 자동 배포
# 사용법: 저장소 Settings > Pages > Source: "GitHub Actions" 선택 후
#         이 파일을 .github/workflows/pages.yml 에 저장하면 자동 동작합니다.
name: Deploy KOTU Landing to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["landing/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: landing

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
